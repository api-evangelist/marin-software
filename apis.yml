apis:
- name: Marin API
  description: >-
    A POST-only REST API for programmatically writing data into Marin. Five bulk
    endpoints — /campaigns, /groups, /keywords, /ads and /strategies — accept a JSON
    body containing a single "data" array of rows whose keys are the same column
    headers used by Marin's bulk-upload spreadsheets. Requests are HTTPS only,
    authenticated with HTTP Basic using a MarinOne username and password issued by a
    Marin representative, and scoped by four required query-string parameters
    (clientId, customerId, userId, userCustomerId) read out of the MarinOne UI. The
    API is versioned in the URI path; only version 0.1 is published. Marin publishes
    no OpenAPI, no SDK and no error catalog beyond HTTP 200 and 500.
  humanURL: https://support.marinsoftware.com/en_US/bulk-actions/marin-api
  baseURL: https://api.marinsoftware.com/open-api
