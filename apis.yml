name: Marin Software
description: >-
  Marin Software is a performance marketing and digital advertising management
  platform used by e-commerce brands, agencies, and enterprise marketers to plan,
  automate, and optimize paid media at scale across paid search, paid social,
  retail media, and app advertising channels. Its product line includes MarinOne
  (campaign management and automation), Marin Connect (marketing data collection
  and unification), Marin Ascend (cross-channel optimization), Marin for Agencies,
  and managed services. Marin publishes a POST-only REST write API — the Marin API,
  at https://api.marinsoftware.com/open-api version 0.1 — that pushes campaigns,
  groups, keywords, ads and strategies into the platform using HTTP Basic auth,
  documented only in the help center, plus a Marin Social API whose reference link
  no longer resolves. There is no OpenAPI, no SDK, no changelog and no status page,
  and the developer documentation portal has been decommissioned. Marin Software has
  been acquired by Zax Capital, which the company announces on its own homepage.
