name: Marin Software
description: >-
  Marin Software is a performance marketing and digital advertising management
  platform used by e-commerce brands, agencies, and enterprise marketers to plan,
  automate, and optimize paid media at scale across paid search, paid social,
  retail media, and app advertising channels. Its product line includes MarinOne
  (campaign management and automation), Marin Connect (marketing data collection
  and unification), Marin Ascend (cross-channel optimization), Marin for Agencies,
  and managed services. Surfaced as a portfolio company of Sapphire Ventures and
  added to the API Evangelist network; Marin publishes a marketing site, help
  center, and application login but no public API developer portal or specification.
