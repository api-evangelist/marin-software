note: >-
  Marin publishes no error catalog, no machine-readable error body, and no RFC 9457
  problem+json. The entire published error contract is a two-row table in the "Errors and
  Limits" section of the Marin API help-center article: "The MarinOne API uses normal HTTP
  response codes to indicate success or failure." Recorded verbatim rather than expanded —
  inventing a 4xx taxonomy Marin does not publish would misrepresent the contract.
