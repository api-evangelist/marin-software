- status: 500
  title: Internal Server Error
  meaning: Request failed.
  source: https://support.marinsoftware.com/en_US/bulk-actions/marin-api
gaps:
- No 4xx statuses are documented, so a caller cannot distinguish a bad credential, a bad
  clientId, a malformed row, or a validation failure from a server fault.
- No error code registry, no per-field validation messages, no remediation guidance.
- No error body schema is published, so an agent cannot parse a failure programmatically.
related_surfaces:
  note: >-
    Marin's help center does document publisher-side integration errors that surface in the
    application (not in the API response body) — for example "Error Communicating With
    Yahoo! API", "Error Communicating With Microsoft Advertising", and "You can't use the
    API until you complete the signup process and are approved." These are MarinOne UI
    sync errors against third-party ad platforms, not Marin API response codes, and are
    listed here for context only.
